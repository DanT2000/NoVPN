# Запуск панели NoVPN через Docker — работает БЕЗ единой переменной окружения.
#
# Быстрый старт (одна команда, из корня репозитория):
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Секреты (ключ шифрования, секрет сессий) панель генерирует сама при первом старте
# и хранит в томе novpn_data (переживают рестарт/пересборку). Продвинутый пользователь
# может задать любые переменные ниже через .env рядом с этим файлом (см. .env.example).
# .env НЕ коммитить.

services:
  manager:
    build:
      context: ..
      dockerfile: deploy/manager.Dockerfile
    # PORT — на каком порту хоста слушать панель. По умолчанию 3000. Если панель ставят
    # на ТОТ ЖЕ сервер, где уже занят 3000 — задайте другой (PORT=8088 в .env).
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Публичный адрес панели (fallback, если домен не задан в самой панели).
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      # Стартовый пароль администратора. По умолчанию «admin» — панель ЗАСТАВИТ сменить
      # его при первом входе (до смены ничего, кроме экрана смены пароля, не отдаётся).
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      # Секреты НЕОБЯЗАТЕЛЬНЫ: пусто → панель сгенерирует ключ шифрования сама и сохранит
      # в /data/encryption.key (том novpn_data), а секрет сессий выведет из него. Задайте
      # свои значения, только если хотите контролировать их вручную (см. .env.example).
      SESSION_SECRET: ${SESSION_SECRET:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      # Ставить true, только если TLS терминируется самим приложением (без прокси).
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Сколько доверенных прокси стоит перед панелью (traefik/nginx). 0 = напрямую.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      DATABASE_PATH: /data/database.sqlite
    volumes:
      # Постоянное хранилище: база, файлы приложений, автоключ шифрования.
      - novpn_data:/data
    restart: unless-stopped

volumes:
  novpn_data:
