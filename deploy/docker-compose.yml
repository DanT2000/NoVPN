# Запуск панели NoVPN через Docker.
# Контекст сборки — корень репозитория:
#   docker compose -f deploy/docker-compose.yml up -d --build
# Значения берутся из .env рядом с этим файлом (см. .env.example). .env НЕ коммитить.

services:
  manager:
    build:
      context: ..
      dockerfile: deploy/manager.Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Публичный адрес панели (fallback, если домен не задан в самой панели).
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      # Стартовый пароль администратора (сменить в панели после первого входа).
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      # Обязательные секреты — без них панель не поднимется.
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET обязателен (см. .env.example)}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY обязателен (см. .env.example)}
      # Ставить true, только если TLS терминируется самим приложением (без прокси).
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Сколько доверенных прокси стоит перед панелью (traefik/nginx). 0 = напрямую.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      DATABASE_PATH: /data/database.sqlite
    volumes:
      # Постоянное хранилище базы — переживает пересборку/обновление образа.
      - novpn_data:/data
    restart: unless-stopped

volumes:
  novpn_data:
