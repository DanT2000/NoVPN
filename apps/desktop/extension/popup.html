<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
    <title>NoVPN</title>
  </head>
  <body>
    <header>
      <span class="wordmark">no<span>vpn</span></span>
      <span id="conn" class="conn"></span>
    </header>

    <main id="body">
      <div id="site" class="site">
        <span id="avatar" class="avatar"></span>
        <span class="site-main">
          <span id="domain" class="domain">—</span>
          <span id="source" class="source"></span>
        </span>
      </div>

      <div id="choices" role="radiogroup" aria-label="Маршрут">
        <button class="choice" data-route="vpn" role="radio" aria-checked="false">
          <span class="radio"></span>
          <span class="label">Через VPN</span>
        </button>
        <button class="choice" data-route="direct" role="radio" aria-checked="false">
          <span class="radio"></span>
          <span class="label">Напрямую</span>
        </button>
      </div>

      <button id="clear" class="link">Убрать правило</button>

      <!-- Что на странице НЕ загрузилось: только реальные сбои (сброс, нет ответа, адрес
           не найден, завис) — выбрать им маршрут в один шаг. Обновляется вживую. -->
      <section id="fail" class="rel" hidden>
        <div id="fail-title" class="rel-title"></div>
        <ul id="fail-list" class="rel-list fail-list"></ul>
        <div class="rel-actions">
          <button id="fail-vpn" class="rel-apply">Через VPN</button>
          <button id="fail-direct" class="rel-apply secondary">Напрямую</button>
        </div>
        <div class="fail-hint">Чаще всего помогает «Через VPN»: значит, адрес заблокирован или замедлен.</div>
      </section>
      <div id="fail-ok" class="fail-ok" hidden>Всё на странице загрузилось</div>
    </main>

    <p id="note" class="note"></p>

    <script src="popup.js"></script>
  </body>
</html>
